name: CI

on:
  pull_request:
    branches:
      - main
  # A pull request can only restore the yarn cache saved by its own runs or by main's, so runs on main save it for every
  # new pull request.
  push:
    branches:
      - main
  # The publish workflow runs CI on the release's commit before publishing.
  workflow_call:

# A new push to a pull request cancels the run still going for its previous push. Every other run gets a group of its
# own, so it always finishes: in a group shared by main's runs, a newer push would cancel a run still waiting to start.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Run ESLint
        run: |
          yarn install --frozen-lockfile
          yarn lint
      - name: Typecheck with legacy and standard decorators
        # Also after ESLint fails, so every check reports its errors in one run.
        if: ${{ !cancelled() }}
        # The playground imports @ambiki/impulse, whose types are the built ones.
        run: |
          yarn build
          yarn typecheck
      - name: Check the documented tsconfigs
        # Also after an earlier check fails.
        if: ${{ !cancelled() }}
        run: yarn test:docs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The project setups the suite is compiled as; see packages/core/web-test-runner.profiles.js.
        profile:
          - esbuild-legacy
          - esbuild-standard
          - tsc-legacy
          - tsc-standard
          - babel-legacy
          - babel-standard
    name: test (${{ matrix.profile }})
    # The image comes with the browsers and the system packages they need, so the job doesn't install them from
    # Ubuntu's mirrors. Keep its version in step with `playwright` in yarn.lock. On a mismatch, `playwright install`
    # downloads the browsers that version needs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's user, as Playwright's CI docs set it up.
      options: --user 1001
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Run test
        run: |
          yarn install --frozen-lockfile
          yarn playwright install chromium firefox webkit
          yarn test
