name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Run ESLint
        run: |
          yarn install --frozen-lockfile
          yarn lint
      - name: Typecheck with legacy and standard decorators
        # The playground imports @ambiki/impulse, whose types are the built ones.
        run: |
          yarn build
          yarn typecheck

  test:
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project setups the suite is compiled as; see packages/core/web-test-runner.profiles.js.
        profile:
          - esbuild-legacy
          - esbuild-standard
          - tsc-legacy
          - tsc-standard
          - babel-legacy
          - babel-standard
    name: test (${{ matrix.profile }})
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
      - name: Run test
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium firefox webkit
          yarn test
