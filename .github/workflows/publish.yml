name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  check_version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # npm takes the version, and the prerelease dist-tag, from package.json, so a release whose tag doesn't match it
      # publishes nothing.
      - name: Check the version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release $TAG doesn't match packages/core/package.json ($version)"
            exit 1
          fi

  # A release can be cut from a branch other than main, where CI hasn't run on its commit.
  ci:
    needs: check_version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `prepublishOnly` builds dist/. A prerelease goes to the dist-tag named by its identifier (2.0.0-rc.0 -> rc),
        # never latest.
        run: |
          version=$(node -p "require('./package.json').version")
          prerelease=${version#*-}
          if [ "$prerelease" = "$version" ]; then
            npm publish
          else
            npm publish --tag "${prerelease%%.*}"
          fi
        working-directory: ./packages/core
